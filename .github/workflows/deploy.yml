name: Build & Deploy Docker Containers to VPS

on:
  push:
    branches:
      - master
      - saksham
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Encode Environment Variables
        id: encode_env
        env:
          BACKEND_RAW: ${{ secrets.BACKEND_ENV }}
          FRONTEND_RAW: ${{ secrets.FRONTEND_ENV }}
        run: |
          B64_BACKEND=$(printf '%s' "$BACKEND_RAW" | base64 -w 0)
          B64_FRONTEND=$(printf '%s' "$FRONTEND_RAW" | base64 -w 0)
          echo "backend_b64=$B64_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend_b64=$B64_FRONTEND" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on VPS..."

            APP_DIR="/home/ubuntu/Meesho_clone"
            REPO_URL="https://github.com/Sakshamgithub2811/Meesho_clone.git"
            TARGET_BRANCH="${{ github.ref_name }}"

            if [ ! -d "$APP_DIR" ]; then
              echo "📦 Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git checkout "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            echo "🔐 Writing environment variables with absolute paths..."
            echo "${{ steps.encode_env.outputs.backend_b64 }}" | base64 -d > "$APP_DIR/backend/.env"
            echo "${{ steps.encode_env.outputs.frontend_b64 }}" | base64 -d > "$APP_DIR/frontend/.env"

            echo "🐳 Launching Docker containers..."
            cd "$APP_DIR"
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up dangling build cache..."
            docker image prune -f

            echo "✅ Deployment finished successfully! Running containers:"
            cd "$APP_DIR"
            docker compose ps
