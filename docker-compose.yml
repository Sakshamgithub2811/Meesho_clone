services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meesho-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - meesho-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meesho-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - meesho-network

networks:
  meesho-network:
    driver: bridge
